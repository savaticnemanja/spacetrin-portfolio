name: Deploy React App (Zero Downtime)

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.HOST }} >> ~/.ssh/known_hosts

      - name: Define release name
        id: vars
        run: echo "release=$(date +%Y%m%d_%H%M%S)" >> $GITHUB_OUTPUT

      # The CI key is locked to /usr/local/bin/spacetrin-deploy on the server:
      # it can only rsync into releases/ (paths relative to that dir) and run
      # `activate <release>`, which swaps `current` and keeps the 5 newest.
      - name: Upload build
        run: |
          rsync -az ./dist/ ${{ secrets.USERNAME }}@${{ secrets.HOST }}:${{ steps.vars.outputs.release }}/

      - name: Activate release
        run: |
          ssh ${{ secrets.USERNAME }}@${{ secrets.HOST }} "activate ${{ steps.vars.outputs.release }}"
