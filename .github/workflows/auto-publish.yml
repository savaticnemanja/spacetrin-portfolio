name: Auto Publish Master to Server

on:
  push:
    branches: [master]

jobs:
  checkout-code:
    name: Checkout Code
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

  setup-dependencies:
    name: Setup Node.js and Build Project
    runs-on: ubuntu-22.04

    strategy:
      matrix:
        node-version: ["20"]

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Build the project
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: build-artifact
          path: ./dist

  fetch-and-deploy:
    name: Deploy to Server
    needs: [checkout-code, setup-dependencies]
    runs-on: ubuntu-22.04

    steps:
      - name: Add SSH key
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Download build artifacts
        uses: actions/download-artifact@v3
        with:
          name: build-artifact
          path: ./dist

      - name: Deploy to server
        run: |
          scp -o StrictHostKeyChecking=no -r ./dist ${{ secrets.USERNAME }}@${{ secrets.HOST }}:/var/www/spacetrin.com/
          ssh -o StrictHostKeyChecking=no ${{ secrets.USERNAME }}@${{ secrets.HOST }} << 'EOF'
          cd /var/www/spacetrin.com
          rm -rf node_modules package-lock.json
          npm install
          EOF
